# CIFAR-10 FedAvg baseline: 50 simulated clients, 10 picked uniformly at random per round, Dirichlet non-IID.
# Run: python experiments/baseline/run_baseline.py --config configs/experiment_cifar10.yaml [--alpha 0.1|0.5|10]
experiment_name: fedavg_baseline
seed: 42
dataset: cifar10
data_dir: data/raw
model: cifar_cnn          # ~1.1M params, FedAvg-paper style CNN

partition:
  type: dirichlet
  alpha: 0.1              # strongly non-IID; 0.5 moderate, 10 near-IID
  min_samples_per_client: 50

federated:
  num_rounds: 150
  clients_per_round: 10   # out of 50 => random selection, leaving room for a scheduler
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.02
  momentum: 0.9
  augment_hflip: true

clients_config: configs/clients_pool50.yaml
results_dir: results
device: auto

energy:
  enabled: true
  sample_interval_s: 1.0
  carbon_intensity_gco2e_kwh: 475.0   # assumed global average for the Colab VM; not a measurement
  cpu_tdp_watts: 65.0
  cpu_idle_fraction: 0.3

system_model:
  base_samples_per_second: 200.0    # placeholder: CIFAR CNN is ~5x the compute of the MNIST CNN per sample
  comm_power_watts: 5.0
  server_power_watts: 200.0
  server_carbon_intensity_gco2e_kwh: 400.0
