# Baseline FedAvg experiment (no scheduler / RL yet).
experiment_name: fedavg_baseline
seed: 42
dataset: mnist            # mnist | fashion_mnist
data_dir: data/raw
model: cnn                # cnn | mlp

partition:
  type: iid               # iid | dirichlet
  alpha: 0.5              # Dirichlet concentration; ignored for iid
  min_samples_per_client: 10

federated:
  num_rounds: 20
  clients_per_round: 5    # all 5 clients participate; fewer => uniform random selection
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.01
  momentum: 0.9

clients_config: configs/clients.yaml
results_dir: results
device: auto              # auto | cpu | cuda

# Energy / carbon accounting of the machine running the experiment (see src/simulation/energy_tracker.py).
energy:
  enabled: true
  sample_interval_s: 1.0
  # Grid carbon intensity in gCO2e/kWh. 475 is roughly the global-average electricity mix; it is an
  # ASSUMPTION, not a measurement of where your Colab VM runs. Override with --carbon-intensity
  # (e.g. a regional value) for a more defensible number.
  carbon_intensity_gco2e_kwh: 475.0
  # Used only when CPU power cannot be read (RAPL is usually hidden on cloud VMs): placeholder values.
  cpu_tdp_watts: 65.0
  cpu_idle_fraction: 0.3
